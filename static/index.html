                <path d="M5 17V9M9 17V5M13 17v-3M17 17V7M21 17v-5" /></svg
              ><span class="label">风险与信号</span
              ><span class="count" data-count="signal">0</span>
            </button>
            <div class="nav-group-label">信息库</div>
            <button class="nav-item" type="button" data-view="all">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path d="M4 5h16v14H4z" />
                <path d="M8 9h8M8 13h5" /></svg
              ><span class="label">全部内容</span
              ><span class="count" data-count="all">0</span>
            </button>
            <button class="nav-item" type="button" data-view="rss">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path
                  d="M5 5a14 14 0 0 1 14 14M5 11a8 8 0 0 1 8 8M6 18h.01"
                /></svg
              ><span class="label">订阅文章</span
              ><span class="count" data-count="rss">0</span>
            </button>
            <button class="nav-item" type="button" data-view="video">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <rect x="3.5" y="5.5" width="17" height="13" rx="3" />
                <path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none" /></svg
              ><span class="label">视频</span
              ><span class="count" data-count="video">0</span>
            </button>
            <button class="nav-item" type="button" data-view="picture">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <rect x="3.5" y="4.5" width="17" height="15" rx="3" />
                <circle cx="9" cy="9.5" r="1.6" />
                <path d="m5.5 17 4.3-4.3a1.4 1.4 0 0 1 2 0l3 3m1.3-1.6.9-.9a1.4 1.4 0 0 1 2 0l1.6 1.6" /></svg
              ><span class="label">图片</span
              ><span class="count" data-count="picture">0</span>
            </button>
            <button class="nav-item" type="button" data-view="meeting">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <rect x="4" y="6" width="16" height="12" rx="2" />
                <path d="M8 6V4M16 6V4M8 11h8M8 14h5" /></svg
              ><span class="label">会议与录音</span
              ><span class="count" data-count="meeting">0</span>
            </button>
            <button class="nav-item" type="button" data-view="obsidian">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path d="M6 4h9l3 3v13H6z" />
                <path d="M15 4v4h4M9 12h6M9 15h5" /></svg
              ><span class="label">Obsidian</span
              ><span class="count" data-count="obsidian">0</span>
            </button>
          </nav>
          <div class="sidebar-section">
            <div class="section-label">
              <span>来源</span><span id="source-count">0</span>
            </div>
            <div class="source-list" id="source-list"></div>
          </div>
          <div class="sidebar-section">
            <div class="section-label"><span>快捷筛选</span></div>
            <div class="nav-list">
              <button class="nav-item" type="button" data-view="starred">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path
                    d="m12 4 2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8z"
                  /></svg
                ><span class="label">收藏</span
                ><span class="count" data-count="starred">0</span>
              </button>
            </div>
          </div>
          <div class="sidebar-bottom" id="hidden-area" hidden>
            <div class="section-label"><span>已隐藏模块</span></div>
            <div id="hidden-list"></div>
          </div>
        </aside>
        <div class="splitter-slot" id="sidebar-splitter-slot">
          <button
            class="splitter"
            id="sidebar-splitter"
            type="button"
            aria-label="调整导航栏宽度"
            title="调整导航栏宽度"
          ></button>
        </div>
        <main class="timeline-panel" id="timeline-panel">
          <div class="timeline-head">
            <div class="timeline-title-row">
              <h1 class="timeline-title" id="timeline-title">优先队列</h1>
              <span class="timeline-count" id="timeline-count">0</span>
            </div>
            <div class="timeline-meta" id="timeline-meta">
              只显示待决策、待行动和关键风险
            </div>
            <div class="search-row">
              <label class="search-box"
                ><svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <circle cx="10.8" cy="10.8" r="6.3" />
                  <path d="m16 16 4 4" /></svg
                ><span class="sr-only">搜索内容</span
                ><input
                  id="search"
                  type="search"
                  placeholder="搜索标题、来源或摘要"
                  autocomplete="off" /></label
              ><button
                class="filter-btn"
                id="clear-filter"
                type="button"
                aria-label="清除筛选"
                title="清除筛选"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path d="M6 6l12 12M18 6 6 18" />
                </svg>
              </button>
            </div>
          </div>
          <div class="timeline-scroll" id="timeline" aria-live="polite" aria-busy="true">
            <div class="timeline-loading timeline-loading-initial" data-timeline-loading role="status" aria-live="polite" aria-busy="true" aria-label="正在读取内容">
              <div class="timeline-loading-status"><span class="timeline-loading-spinner" aria-hidden="true"></span><strong>正在读取内容</strong><span>正在准备你的信息流</span></div>
              <div class="timeline-loading-cards">
                <article class="timeline-skeleton-card is-article" aria-hidden="true"><span class="timeline-skeleton-line timeline-skeleton-avatar"></span><div class="timeline-skeleton-copy"><div class="timeline-skeleton-head"><span class="timeline-skeleton-line"></span><span class="timeline-skeleton-line"></span></div><span class="timeline-skeleton-line is-wide"></span><span class="timeline-skeleton-line is-medium"></span><span class="timeline-skeleton-line timeline-skeleton-meta"></span></div></article>
                <article class="timeline-skeleton-card is-social" aria-hidden="true"><span class="timeline-skeleton-line timeline-skeleton-avatar"></span><div class="timeline-skeleton-copy"><div class="timeline-skeleton-head"><span class="timeline-skeleton-line"></span><span class="timeline-skeleton-line"></span></div><span class="timeline-skeleton-line is-wide"></span><span class="timeline-skeleton-line is-short"></span><span class="timeline-skeleton-line timeline-skeleton-meta"></span></div></article>
                <article class="timeline-skeleton-card is-video" aria-hidden="true"><span class="timeline-skeleton-media"></span><div class="timeline-skeleton-video-copy"><span class="timeline-skeleton-line"></span><span class="timeline-skeleton-line is-medium"></span><span class="timeline-skeleton-line timeline-skeleton-meta"></span></div></article>
              </div>
            </div>
          </div>
        </main>
        <div class="splitter-slot" id="timeline-splitter-slot">
          <button
            class="splitter"
            id="timeline-splitter"
            type="button"
            aria-label="调整时间线宽度"
            title="调整时间线宽度"
          ></button>
        </div>
        <aside
          class="detail-panel"
          id="detail-panel"
          aria-label="内容详情"
        ></aside>
      </div>
    </div>
    <div class="error-bar" id="error-bar" role="alert" hidden></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="modal-backdrop" id="discover-modal" hidden>
      <section
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="discover-title"
      >
        <div class="modal-head">
          <div>
            <h2 id="discover-title">发现来源</h2>
            <p>订阅公开内容，会议录音由当前 Agent 自动维护</p>
          </div>
          <button
            class="icon-btn"
            id="close-discover"
            type="button"
            aria-label="关闭"
            title="关闭"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <div class="catalog">
          <h3 class="catalog-title">推荐来源</h3>
          <p class="catalog-subtitle">
            点击加号即可订阅或退订；同步由当前设备应用处理。
          </p>
          <div class="catalog-list" id="source-catalog">
            <div class="catalog-empty">正在读取来源目录</div>
          </div>
        </div>
        <form class="modal-form" id="discover-form">
          <label for="feed-url">添加其他公开 RSS / Atom</label
          ><input
            id="feed-url"
            type="url"
            inputmode="url"
            placeholder="https://example.com/feed.xml"
            maxlength="1000"
            required
          />
          <div class="modal-error" id="discover-error" aria-live="polite"></div>
          <div class="modal-actions">
            <button class="text-btn" id="cancel-discover" type="button">
              关闭</button
            ><button class="primary-btn" type="submit">
              <span>添加并首次同步</span
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path d="M5 12h13M13 6l6 6-6 6" />
              </svg>
            </button>
          </div>
        </form>
        <p class="modal-footnote">
          自定义地址由当前设备应用验证；无法由应用验证时，可在 Chat 中让 Agent
          处理。
        </p>
      </section>
    </div>
    <script src="./static/js/focus-app.js?v=20260928-overview-default"></script>
    <script src="./static/vendor/cytoscape.min.js?v=3.34.3"></script>
    <script src="./static/reader-parity.js?v=20260928-graph-tidy4"></script>
    <script src="./static/reader-bootstrap.js?v=20260911-first-paint"></script>
  </body>
</html>
